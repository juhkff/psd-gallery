<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>图库管理端 · 上传 PSD</title>
<style>
  /* ------------------------------------------------------------------ *
   * LIQUID GLASS - local studio edition.
   *
   * This page is a standalone file with no build step, so the gallery's
   * design tokens (src/index.css) are mirrored here BY HAND. Keep the two in
   * sync: the studio must read as the same product as the gallery.
   *
   * The one rule that keeps the glass from silently dying:
   *   never put transform / filter / backdrop-filter / opacity < 1 /
   *   overflow: hidden on an ANCESTOR of a pane. Clip the sheen with
   *   border-radius on the sheen layer itself instead.
   * ------------------------------------------------------------------ */
  :root {
    --s950: #06060a; --s900: #0d0d14; --s850: #12121a; --s800: #17171f;
    --s700: #23232e; --s600: #353542; --s400: #6b6b7a; --s300: #b9b9c6;
    --s200: #d6d6e0; --s100: #ececf2;
    --accent: #c9a227; --accent-soft: #e6c65c; --ember: #b45f3f;
    --ion: #7c6bd4; --ice: #8fd0e8;
    --ok: #63b37a; --bad: #d9645f;

    --sheen: liquid-sweep 9s ease-in-out infinite;
    --rim: rim-spin 6s linear infinite;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--s100);
    background-color: var(--s950);
    font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
    /* `clip`, NOT `hidden`: overflow:hidden would make the body a paint
       container and kill every backdrop-filter underneath it. */
    overflow-x: clip;
  }

  /* --- ambient light pools (fixed, so the panes always have something to refract) */
  .ambient {
    position: fixed; inset: 0; pointer-events: none;
    background-color: var(--s950);
    background-image:
      radial-gradient(58rem 38rem at 10% -12%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 68%),
      radial-gradient(46rem 34rem at 92% 4%, color-mix(in oklab, var(--ion) 20%, transparent), transparent 70%),
      radial-gradient(40rem 30rem at 48% 112%, color-mix(in oklab, var(--ember) 16%, transparent), transparent 72%),
      radial-gradient(30rem 24rem at 78% 62%, color-mix(in oklab, var(--ice) 9%, transparent), transparent 70%);
  }

  .wrap { position: relative; max-width: 1080px; margin: 0 auto; padding: 34px 20px 72px; }

  :focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; border-radius: 6px; }
  ::selection { background: color-mix(in oklab, var(--accent) 38%, transparent); color: var(--s100); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in oklab, var(--s100) 14%, transparent);
    border-radius: 6px; border: 2px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in oklab, var(--accent) 45%, transparent); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* --- masthead ------------------------------------------------------ */
  .masthead { padding: 2px 2px 26px; }
  .eyebrow {
    display: flex; align-items: center; gap: 9px;
    margin: 0 0 10px; font-size: 11px; font-weight: 600;
    letter-spacing: .26em; text-transform: uppercase;
    color: var(--accent-soft);
  }
  .eyebrow::before {
    content: ''; width: 22px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-soft));
  }
  h1 {
    margin: 0 0 8px; font-size: 27px; line-height: 1.25; letter-spacing: .01em;
    background-image: linear-gradient(100deg, var(--s100), var(--ice) 55%, var(--ion));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0; max-width: 62ch; color: var(--s300); font-size: 13px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px; border-radius: 999px; font-size: 11px; color: var(--s200);
    border: 1px solid color-mix(in oklab, var(--s100) 12%, transparent);
    background: color-mix(in oklab, var(--s800) 55%, transparent);
    box-shadow: inset 0 1px 0 0 color-mix(in oklab, var(--s100) 12%, transparent);
  }
  .pill i { width: 6px; height: 6px; border-radius: 999px; background: var(--accent-soft); box-shadow: 0 0 8px var(--accent-soft); }
  .pill.ion i { background: var(--ion); box-shadow: 0 0 8px var(--ion); }
  .pill.ice i { background: var(--ice); box-shadow: 0 0 8px var(--ice); }

  /* --- glass panes --------------------------------------------------- */
  .panel {
    position: relative; isolation: isolate;
    padding: 20px;
    border-radius: 20px;
    border: 1px solid color-mix(in oklab, var(--s100) 12%, transparent);
    background-color: color-mix(in oklab, var(--s900) 62%, transparent);
    background-image:
      linear-gradient(165deg, color-mix(in oklab, var(--s100) 7%, transparent), transparent 42%),
      radial-gradient(120% 80% at 12% -10%, color-mix(in oklab, var(--ice) 9%, transparent), transparent 60%);
    backdrop-filter: blur(18px) saturate(165%);
    -webkit-backdrop-filter: blur(18px) saturate(165%);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 22%, transparent),
      inset 0 -1px 0 0 color-mix(in oklab, black 45%, transparent),
      inset 0 0 40px -18px color-mix(in oklab, var(--ice) 40%, transparent),
      0 10px 34px -14px rgb(0 0 0 / .7);
  }
  /* Content must paint above the sheen (z 3). */
  .pane-body { position: relative; z-index: 1; }

  /* Slow moving film. Absolute child clipped by ITS OWN border-radius -
     putting overflow:hidden on the pane would create a paint container and
     break the pane's backdrop-filter. */
  .sheen {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    border-radius: inherit; overflow: hidden;
    mix-blend-mode: screen; opacity: .75;
  }
  .sheen::before {
    content: ''; position: absolute; top: -60%; left: -40%; width: 55%; height: 220%;
    background: linear-gradient(
      100deg,
      transparent,
      color-mix(in oklab, var(--s100) 12%, transparent) 42%,
      color-mix(in oklab, var(--ice) 16%, transparent) 55%,
      transparent
    );
    filter: blur(6px);
    animation: var(--sheen);
  }

  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1 1 auto; min-width: 0; }
  label { display: block; margin-bottom: 6px; font-size: 12px; color: var(--s300); letter-spacing: .02em; }

  input[type=date] {
    font: inherit; color: var(--s100); color-scheme: dark;
    padding: 9px 11px; border-radius: 11px;
    border: 1px solid color-mix(in oklab, var(--s100) 13%, transparent);
    background: color-mix(in oklab, var(--s850) 70%, transparent);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 14%, transparent),
      inset 0 -1px 0 0 color-mix(in oklab, black 40%, transparent),
      0 6px 18px -14px rgb(0 0 0 / .8);
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=date]:hover { border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
  input[type=date]:focus { border-color: color-mix(in oklab, var(--accent) 65%, transparent); outline: none; }

  /* --- buttons ------------------------------------------------------- */
  button {
    font: inherit; cursor: pointer; color: var(--s100);
    padding: 9px 18px; border-radius: 999px;
    border: 1px solid color-mix(in oklab, var(--s100) 13%, transparent);
    background-color: color-mix(in oklab, var(--s800) 72%, transparent);
    background-image: linear-gradient(180deg, color-mix(in oklab, var(--s100) 7%, transparent), transparent 65%);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 16%, transparent),
      inset 0 -1px 0 0 color-mix(in oklab, black 40%, transparent),
      0 8px 20px -14px rgb(0 0 0 / .85);
    transition: border-color .2s, color .2s, box-shadow .25s, background-color .2s, filter .2s;
  }
  button:hover:not(:disabled) {
    border-color: color-mix(in oklab, var(--accent) 55%, transparent);
    color: var(--accent-soft);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--accent-soft) 35%, transparent),
      0 12px 26px -14px rgb(0 0 0 / .9),
      0 0 0 1px color-mix(in oklab, var(--accent) 22%, transparent);
  }
  button:active:not(:disabled) { box-shadow: inset 0 2px 6px -2px rgb(0 0 0 / .8); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* The ONE primary CTA: gold fill + a rotating conic rim masked to a 1px ring. */
  button.primary {
    position: relative; isolation: isolate;
    border: none; color: #17120a; font-weight: 600; padding: 10px 22px;
    background-image: linear-gradient(100deg, var(--accent-soft), var(--accent) 48%, var(--ember));
    box-shadow:
      inset 0 1px 0 0 rgb(255 255 255 / .45),
      inset 0 -2px 6px -2px rgb(120 60 20 / .55),
      0 12px 30px -12px color-mix(in oklab, var(--accent) 70%, transparent);
  }
  button.primary::before {
    content: ''; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      color-mix(in oklab, var(--accent-soft) 85%, transparent) 60deg,
      color-mix(in oklab, var(--ice) 70%, transparent) 130deg,
      transparent 200deg,
      transparent 360deg
    );
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: var(--rim);
    pointer-events: none;
  }
  button.primary:hover:not(:disabled) { color: #17120a; filter: brightness(1.06); }
  button.primary:disabled::before { animation: none; }

  /* --- drop zone ----------------------------------------------------- */
  #drop {
    position: relative; margin-top: 18px; padding: 34px 18px;
    text-align: center; cursor: pointer; border-radius: 16px;
    border: 1.5px dashed color-mix(in oklab, var(--s100) 18%, transparent);
    background-color: color-mix(in oklab, var(--s850) 55%, transparent);
    background-image:
      linear-gradient(180deg, color-mix(in oklab, var(--s100) 4%, transparent), transparent 62%),
      radial-gradient(90% 120% at 50% -30%, color-mix(in oklab, var(--ice) 8%, transparent), transparent 60%);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 12%, transparent),
      inset 0 0 34px -18px color-mix(in oklab, var(--ice) 45%, transparent);
    transition: border-color .22s, background-color .25s, box-shadow .25s, color .22s;
  }
  #drop::after {
    content: ''; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
    opacity: 0; transition: opacity .25s;
    box-shadow:
      0 0 0 1px color-mix(in oklab, var(--accent-soft) 60%, transparent),
      0 0 38px -6px color-mix(in oklab, var(--accent) 55%, transparent);
  }
  #drop:hover { border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
  #drop strong { display: block; margin-bottom: 5px; font-size: 15px; font-weight: 600; }
  #drop span { color: var(--s300); font-size: 12px; }
  /* Real drag-and-drop state: an accent-tinted glass edge, not just a border swap. */
  #drop.hot {
    border-color: color-mix(in oklab, var(--accent-soft) 88%, transparent);
    background-color: color-mix(in oklab, var(--accent) 13%, transparent);
    background-image:
      linear-gradient(180deg, color-mix(in oklab, var(--accent) 18%, transparent), transparent 65%),
      radial-gradient(90% 120% at 50% -30%, color-mix(in oklab, var(--accent-soft) 16%, transparent), transparent 60%);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--accent-soft) 45%, transparent),
      inset 0 -1px 0 0 color-mix(in oklab, black 45%, transparent),
      inset 0 0 46px -14px color-mix(in oklab, var(--accent) 80%, transparent),
      0 16px 44px -20px color-mix(in oklab, var(--accent) 65%, transparent);
  }
  #drop.hot::after { opacity: 1; }
  #drop.hot strong { color: var(--accent-soft); }

  .hint { margin-top: 12px; font-size: 12px; color: var(--s300); }

  .bar { position: relative; height: 3px; margin-top: 12px; border-radius: 999px; overflow: hidden;
         background: color-mix(in oklab, var(--s100) 10%, transparent); }
  .bar > i {
    display: block; height: 100%; width: 35%;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
    box-shadow: 0 0 12px -1px var(--accent-soft);
    animation: slide 1.2s linear infinite;
  }

  /* --- section headings ---------------------------------------------- */
  h2 {
    display: flex; align-items: center; gap: 10px;
    margin: 32px 0 12px; font-size: 11px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase; color: var(--s300);
  }
  h2::after {
    content: ''; flex: 1 1 auto; height: 1px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--s100) 16%, transparent), transparent);
  }
  .tag {
    padding: 2px 9px; border-radius: 999px; font-size: 11px; color: var(--s100);
    font-variant-numeric: tabular-nums; letter-spacing: .02em;
    border: 1px solid color-mix(in oklab, var(--s100) 14%, transparent);
    background: color-mix(in oklab, var(--s100) 7%, transparent);
    box-shadow: inset 0 1px 0 0 color-mix(in oklab, var(--s100) 14%, transparent);
  }

  /* --- rows: thin glass surfaces ------------------------------------- */
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  li.item {
    position: relative; isolation: isolate;
    display: flex; gap: 12px; align-items: center; padding: 10px 13px;
    border-radius: 14px;
    border: 1px solid color-mix(in oklab, var(--s100) 10%, transparent);
    background-color: color-mix(in oklab, var(--s900) 52%, transparent);
    background-image: linear-gradient(170deg, color-mix(in oklab, var(--s100) 6%, transparent), transparent 55%);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 16%, transparent),
      0 6px 20px -12px rgb(0 0 0 / .6);
    transition: border-color .2s, box-shadow .25s, background-color .2s;
  }
  li.item::before {
    content: ''; position: absolute; left: 0; top: 11px; bottom: 11px; width: 2px;
    border-radius: 0 2px 2px 0;
    background: linear-gradient(180deg, var(--accent-soft), var(--ember));
    opacity: 0; transition: opacity .22s;
  }
  li.item:hover {
    border-color: color-mix(in oklab, var(--accent) 45%, transparent);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 22%, transparent),
      0 12px 30px -14px rgb(0 0 0 / .8),
      0 0 0 1px color-mix(in oklab, var(--accent) 20%, transparent);
  }
  li.item:hover::before { opacity: .95; }

  li.item img {
    width: 54px; height: 54px; flex: none;
    object-fit: cover; border-radius: 10px; background: #202028;
    box-shadow:
      0 0 0 1px color-mix(in oklab, var(--s100) 14%, transparent),
      0 8px 18px -10px rgb(0 0 0 / .9);
  }
  /* PSD placeholder: checkerboard (transparency indicator) reads as a real asset tile. */
  .ph {
    width: 54px; height: 54px; flex: none; border-radius: 10px;
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; letter-spacing: .1em;
    color: var(--s100); text-shadow: 0 1px 3px rgb(0 0 0 / .9);
    background-color: #1c1c24;
    background-image:
      linear-gradient(45deg, #2a2a33 25%, transparent 25%),
      linear-gradient(-45deg, #2a2a33 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #2a2a33 75%),
      linear-gradient(-45deg, transparent 75%, #2a2a33 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 18%, transparent),
      0 0 0 1px color-mix(in oklab, var(--s100) 12%, transparent),
      0 8px 18px -10px rgb(0 0 0 / .9);
  }
  .meta { min-width: 0; flex: 1; }
  .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { margin-top: 2px; font-size: 12px; color: var(--s300); }
  .ok { color: var(--ok); }
  .bad { color: var(--bad); }
  .draft-head { display: flex; align-items: baseline; gap: 9px; margin: 18px 0 9px; }
  .draft-head b { font-weight: 600; font-size: 14px; letter-spacing: .01em; }
  .draft-head span { color: var(--s300); font-size: 12px; }
  .actions { margin-top: 18px; }

  #log {
    margin-top: 16px; max-height: 240px; overflow: auto; padding: 14px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.65; white-space: pre-wrap; color: var(--s200);
    border-radius: 14px;
    border: 1px solid color-mix(in oklab, var(--s100) 10%, transparent);
    background-color: color-mix(in oklab, var(--s950) 74%, transparent);
    background-image: linear-gradient(170deg, color-mix(in oklab, var(--s100) 5%, transparent), transparent 55%);
    box-shadow:
      inset 0 1px 0 0 color-mix(in oklab, var(--s100) 10%, transparent),
      inset 0 0 46px -22px color-mix(in oklab, var(--ice) 40%, transparent),
      0 10px 26px -18px rgb(0 0 0 / .85);
  }

  .hidden { display: none !important; }

  @keyframes liquid-sweep {
    0%   { transform: translate3d(-120%, 0, 0) rotate(9deg) scale(1.5); opacity: 0; }
    12%  { opacity: .55; }
    50%  { transform: translate3d(10%, 0, 0) rotate(9deg) scale(1.5); opacity: .28; }
    88%  { opacity: .5; }
    100% { transform: translate3d(130%, 0, 0) rotate(9deg) scale(1.5); opacity: 0; }
  }
  @keyframes rim-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(320%); } }

  /* Without backdrop-filter the panes must still be readable: go opaque. */
  @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
    .panel { background-color: color-mix(in oklab, var(--s900) 94%, transparent); }
    li.item { background-color: color-mix(in oklab, var(--s900) 92%, transparent); }
  }

  @media (prefers-contrast: more) {
    .panel, li.item {
      background-color: color-mix(in oklab, var(--s950) 93%, transparent);
      border-color: color-mix(in oklab, var(--s100) 30%, transparent);
    }
    .sheen { display: none; }
  }

  @media (max-width: 560px) {
    h1 { font-size: 23px; }
    .panel { padding: 16px; }
    #drop { padding: 26px 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .sheen::before, button.primary::before, .bar > i { animation: none !important; }
    .sheen { opacity: .3; }
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Local Studio</p>
    <h1>图库管理端</h1>
    <p class="sub">把 PSD 拖进来 → 自动生成预览与图层清单 → 点「发布」才会提交并推送到 GitHub。仅本机可用。</p>
    <div class="pills">
      <span class="pill"><i></i>草稿不提交</span>
      <span class="pill ion"><i></i>本地解码</span>
      <span class="pill ice"><i></i>127.0.0.1</span>
    </div>
  </header>

  <section class="panel">
    <i class="sheen" aria-hidden="true"></i>
    <div class="pane-body">
      <div class="row">
        <div>
          <label for="date">放到的日期文件夹</label>
          <input type="date" id="date" />
        </div>
        <div class="grow"></div>
        <div>
          <label aria-hidden="true">&nbsp;</label>
          <button id="pick">选择 PSD 文件…</button>
        </div>
      </div>

      <div id="drop">
        <strong>把 .psd 文件拖到这里</strong>
        <span>可以一次拖多个；文件名会自动改成 1.psd、2.psd… 按数字排序</span>
      </div>
      <input type="file" id="file" accept=".psd" multiple class="hidden" />
      <div id="progress-bar" class="bar hidden"><i></i></div>
      <div class="hint">单文件上限 100 MiB（GitHub 硬限制，走 LFS 也一样）。草稿在发布前不会提交。</div>
    </div>
  </section>

  <h2>待发布草稿 <span id="draft-count" class="tag">0</span></h2>
  <div id="drafts"></div>
  <div class="row actions">
    <button id="publish" class="primary" disabled>发布（提交并推送）</button>
    <button id="refresh">刷新</button>
  </div>
  <div id="log" class="hidden"></div>

  <h2>已归档作品 <span id="work-count" class="tag">0</span></h2>
  <ul id="works"></ul>
</div>

<script>
const TOKEN = '__STUDIO_TOKEN__';
const $ = (id) => document.getElementById(id);
const state = { gallery: null, busy: false };

function bytes(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KiB';
  return (n / 1048576).toFixed(1) + ' MiB';
}
function log(text) {
  const el = $('log');
  el.classList.remove('hidden');
  el.textContent = text;
}
function setBusy(busy, label) {
  state.busy = busy;
  $('publish').disabled = busy || !hasDrafts();
  $('progress-bar').classList.toggle('hidden', !busy);
  if (label) log(label);
}
function hasDrafts() {
  return (state.gallery?.totals?.drafts ?? 0) > 0;
}

function renderDrafts() {
  const host = $('drafts');
  host.innerHTML = '';
  const groups = state.gallery?.drafts ?? [];
  $('draft-count').textContent = state.gallery?.totals?.drafts ?? 0;
  if (groups.length === 0) {
    host.innerHTML = '<p class="hint">还没有草稿。上传的 PSD 会先出现在这里，点发布后才进入图库。</p>';
    return;
  }
  for (const group of groups) {
    const head = document.createElement('div');
    head.className = 'draft-head';
    head.innerHTML = '<b>' + group.date + '</b><span>' + group.entries.length + ' 件待发布</span>';
    host.appendChild(head);
    const ul = document.createElement('ul');
    for (const entry of group.entries) {
      const li = document.createElement('li');
      li.className = 'item';
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = 'PSD';
      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = entry.stem + '.psd';
      const detail = document.createElement('div');
      detail.className = 'detail';
      detail.textContent = bytes(entry.bytes) + ' · 发布后 → ' + entry.publishTo + '（序号按发布时确定）';
      meta.append(name, detail);
      li.append(ph, meta);
      ul.appendChild(li);
    }
    host.appendChild(ul);
  }
}

function renderWorks() {
  const host = $('works');
  host.innerHTML = '';
  const groups = state.gallery?.manifest?.groups ?? [];
  $('work-count').textContent = state.gallery?.manifest?.totalWorks ?? 0;
  if (groups.length === 0) {
    host.innerHTML = '<li class="item"><div class="meta"><div class="detail">还没有已归档作品</div></div></li>';
    return;
  }
  for (const group of groups) {
    const li = document.createElement('li');
    li.className = 'item';
    const thumb = group.works[0]?.thumb;
    if (thumb) {
      const img = document.createElement('img');
      img.src = thumb;
      img.alt = '';
      // The studio server has no route for public/generated/** yet, so a
      // missing thumbnail must degrade to the PSD tile - never to the browser's
      // broken-image glyph. Inert once the thumb actually resolves.
      img.addEventListener('error', () => {
        const fallback = document.createElement('div');
        fallback.className = 'ph';
        fallback.textContent = 'PSD';
        img.replaceWith(fallback);
      });
      li.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = 'PSD';
      li.appendChild(ph);
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = group.date;
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.textContent = group.works.map((w) => w.name + '.psd').join('、');
    meta.append(name, detail);
    li.appendChild(meta);
    host.appendChild(li);
  }
}

async function refresh() {
  const response = await fetch('/api/status');
  const data = await response.json();
  state.gallery = data.gallery;
  if (!$('date').value) $('date').value = data.today;
  renderDrafts();
  renderWorks();
  $('publish').disabled = state.busy || !hasDrafts();
  return data;
}

async function upload(files) {
  if (!files || files.length === 0) return;
  const form = new FormData();
  form.append('date', $('date').value);
  for (const file of files) form.append('files', file);
  setBusy(true, '正在上传 ' + files.length + ' 个文件…');
  try {
    const response = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'x-studio-token': TOKEN },
      body: form,
    });
    const data = await response.json();
    const lines = [];
    for (const item of data.accepted ?? []) lines.push('✅ ' + item.original + ' → ' + item.path);
    for (const item of data.rejected ?? []) lines.push('❌ ' + item.original + '：' + item.reason);
    if (data.error) lines.push('❌ ' + data.error);
    if (data.rebuilding) lines.push('⏳ 正在生成预览与图层清单…');
    log(lines.join('\n'));
    state.gallery = data.gallery;
    renderDrafts();
    renderWorks();
    if (data.rebuilding) {
      // the manifest rebuild runs in the background; poll until it settles
      const started = Date.now();
      while (Date.now() - started < 10 * 60 * 1000) {
        await new Promise((r) => setTimeout(r, 1200));
        const status = await refresh();
        if (!status.gallery.build.running && status.gallery.build.queued === 0) break;
      }
      log(lines.join('\n') + '\n✅ 预览已就绪，可以发布了');
    }
  } catch (error) {
    log('❌ 上传失败：' + error.message);
  } finally {
    setBusy(false);
    $('publish').disabled = state.busy || !hasDrafts();
  }
}

async function publish() {
  if (!confirm('发布这些草稿？会写入 works/、重新生成预览，并 commit + push 到 GitHub。')) return;
  setBusy(true, '正在发布…');
  try {
    const response = await fetch('/api/publish', { method: 'POST', headers: { 'x-studio-token': TOKEN } });
    const data = await response.json();
    const lines = (data.steps ?? []).map((step) => (step.ok ? '✅ ' : '❌ ') + step.step + ' — ' + step.detail);
    lines.push((data.ok ? '✅ ' : '❌ ') + data.message);
    log(lines.join('\n'));
    await refresh();
  } catch (error) {
    log('❌ 发布失败：' + error.message);
  } finally {
    setBusy(false);
  }
}

const drop = $('drop');
const fileInput = $('file');
$('pick').addEventListener('click', () => fileInput.click());
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { upload(fileInput.files); fileInput.value = ''; });
for (const type of ['dragenter', 'dragover']) {
  drop.addEventListener(type, (event) => { event.preventDefault(); drop.classList.add('hot'); });
}
for (const type of ['dragleave', 'drop']) {
  drop.addEventListener(type, () => drop.classList.remove('hot'));
}
drop.addEventListener('drop', (event) => {
  event.preventDefault();
  const files = Array.from(event.dataTransfer?.files ?? []).filter((f) => /\.psd$/i.test(f.name));
  if (files.length === 0) { log('❌ 没有检测到 .psd 文件'); return; }
  upload(files);
});
$('publish').addEventListener('click', publish);
$('refresh').addEventListener('click', refresh);
window.addEventListener('beforeunload', (event) => {
  if (state.busy) { event.preventDefault(); event.returnValue = ''; }
});
refresh();
setInterval(() => { if (!state.busy) refresh().catch(() => {}); }, 5000);
</script>
</body>
